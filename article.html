<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Article | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: -1;
    }

    .nav-container {
      width: 85%;
      max-width: 750px;
      margin-top: 3rem;
    }

    .back-link {
      color: #aaa;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .article-content {
      width: 85%;
      max-width: 750px;
      margin-top: 2rem;
      margin-bottom: 6rem;
      font-size: 1.2rem;
      line-height: 1.7;
      color: #dddddd;
      text-align: left; /* Snaps all regular text and principles strictly to the left edge */
    }

    /* Style for cleanly parsed text blocks */
    .article-content p {
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-indent: 0 !important; /* Absolute guard against indentation */
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <a href="en.html" class="back-link">← Back to Thoughts</a>
  </div>

  <div id="content-target" class="article-content">Loading essay...</div>

  <script>
    const textSourceFile = 'Promising_as_an_Epistemic_Practice.txt';

    fetch(textSourceFile)
      .then(response => {
        if (!response.ok) throw new Error('File not found');
        return response.text();
      })
      .then(text => {
        const target = document.getElementById('content-target');
        target.innerHTML = ''; // Clear loading message

        // Automatically splits your text into chunks by line breaks,
        // trims off any hidden formatting spaces from the left, and wraps them safely
        text.split('\n').forEach(line => {
          const trimmedLine = line.trim();
          if (trimmedLine.length > 0) {
            const p = document.createElement('p');
            p.textContent = trimmedLine;
            target.appendChild(p);
          } else {
            // Adds empty vertical spacing for paragraph breaks
            const br = document.createElement('div');
            br.style.height = '1rem';
            target.appendChild(br);
          }
        });
      })
      .catch(err => {
        document.getElementById('content-target').innerHTML = 
          `<p style="color: #ff6b6b;">Error loading the essay file. Make sure ${textSourceFile} exists in your repository.</p>`;
      });
  </script>

</body>
</html>
