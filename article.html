<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promising as an Epistemic Practice | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* Prevents double scrollbars */
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: -1;
    }

    .nav-container {
      width: 90%;
      max-width: 1100px;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: flex-start;
    }

    .back-link {
      color: #aaa;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .pdf-container {
      width: 90%;
      max-width: 1100px;
      flex-grow: 1; /* Automatically stretches to fill vertical space */
      margin-bottom: 2rem;
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <a href="en.html" class="back-link">← Back to Thoughts</a>
  </div>

  <div class="pdf-container">
