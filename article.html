<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Article | Iman Aghahakim</title>
  <!-- Load the robust PDF.js rendering engine from a secure public network -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: -1;
    }

    .nav-container {
      width: 90%;
      max-width: 850px;
      margin-top: 3rem;
      margin-bottom: 2rem;
    }

    .back-link {
      color: #aaa;
      text-decoration: none;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* Container holding the dynamically generated text-page elements */
    #pdf-viewer-container {
      width: 90%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-bottom: 6rem;
    }

    /* Styles each page cleanly over your dark canvas without any indents */
    canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <a href="en.html" class="back-link">← Back to Thoughts</a>
  </div>

  <!-- Your PDF file contents will cleanly render directly right here -->
  <div id="pdf-viewer-container"></div>

  <script>
    // ==========================================
    // 💡 THE TEMPLATE SWITCH:
    // Change this single filename to show any other article PDF you upload!
    // ==========================================
    const pdfFilename = 'Promising as an Epistemic Practice.pdf';

    // Point the engine script to its internal worker asset
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const container = document.getElementById('pdf-viewer-container');

    // Fetch the target document file from your repo assets
    pdfjsLib.getDocument(pdfFilename).promise.then(pdf => {
      // Intelligently loops through your paper sequentially, page by page
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          const canvas = document.createElement('canvas');
          container.appendChild(canvas);

          const context = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: 2.0 }); // High-fidelity scale generation

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          page.render(renderContext);
        });
      }
    }).catch(error => {
      console.error('Error rendering PDF text streams: ', error);
      container.innerHTML = `<p style="color: #ff6b6b; text-align: center;">Unable to securely stream paper content layout asset.</p>`;
    });
  </script>

</body>
</html>
