<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Thought | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      /* Using the same background image for continuity */
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed; /* Keeps background stable while scrolling */
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* An overlay to slightly darken the image so your essays are highly readable */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75); 
      z-index: -1;
    }

    header {
      text-align: center;
      margin-top: 4rem;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 3rem;
      width: 85%;
      max-width: 750px;
      margin-top: 4rem;
      margin-bottom: 4rem;
    }

    /* Custom style for your future essays instead of the blank boxes */
    .essay-preview {
      border-bottom: 1px solid #333;
      padding-bottom: 2rem;
    }

    .essay-title {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .essay-date {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1rem;
    }

    .essay-excerpt {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ccc;
    }
  </style>
</head>
<body>

  <header>My Thought</header>

  <div class="content">
    <!-- The blank boxes have been removed. 
         Below is an example of how you can structure your first essay entry: -->
    <div class="essay-preview">
      <div class="essay-title">First Philosophical Reflection</div>
      <div class="essay-date">July 2026</div>
      <div class="essay-excerpt">
        This is where your brainstorming thoughts and philosophical texts will go. The text sits beautifully over a darkened version of your home page canvas...
      </div>
    </div>
  </div>

</body>
</html>
