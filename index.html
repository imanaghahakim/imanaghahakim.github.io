<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', Times, serif;
      background-image: url('ooo-1160x773.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent dark overlay */
      padding: 3rem;
      border-radius: 4px;
      max-width: 700px;
      width: 80%;
      box-sizing: border-box;
    }
    .intro {
      font-size: 1.8rem; /* Increased size to match the image layout */
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 2rem;
    }
    .lang-btn {
      padding: 0.5rem 1rem;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.8rem; /* Matches the intro text size */
      border: none;
      background: none;
      color: #ffffff;
      cursor: pointer;
      text-decoration: underline; /* Default underline to match the image layout */
    }
    .lang-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="intro">hi, I'm Iman Aghahakim and i write my brain storming thought here. usually about philosophy</span>
    <button class="lang-btn" onclick="location.href='en.html'">English</button>
  </div>
</body>
</html>
