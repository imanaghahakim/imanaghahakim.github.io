<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', Times, serif;
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }
    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 700px;
      width: 80%;
      box-sizing: border-box;
      /* Removed background-color, padding, and border-radius to leave text naked */
    }
    .intro {
      font-size: 1.8rem;
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 2rem;
      /* Subtle shadow ensures text remains readable over light areas of the image */
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8), -1px -1px 4px rgba(0, 0, 0, 0.8);
    }
    .lang-btn {
      padding: 0.5rem 1rem;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.8rem;
      border: none;
      background: none;
      color: #ffffff;
      cursor: pointer;
      text-decoration: underline;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8), -1px -1px 4px rgba(0, 0, 0, 0.8);
    }
    .lang-btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="intro">Hi, I'm Iman, and I write my brain storming thoughts here. Usually about philosophy.</span>
    <button class="lang-btn" onclick="location.href='en.html'">English</button>
  </div>
</body>
</html>
