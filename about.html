<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me | Iman Aghahakim</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('ooo-1160x773.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .nav-container {
      width: 85%;
      max-width: 950px;
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      justify-content: flex-start;
    }

    .nav-link {
      font-size: 1.3rem; 
      color: #aaa;
      cursor: pointer;
      text-decoration: none;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
      text-decoration: underline;
    }

    .about-grid {
      display: flex;
      gap: 4rem;
      width: 85%;
      max-width: 950px;
      margin-top: 4rem;
      margin-bottom: 6rem;
    }

    .sidebar {
      flex: 1;
      max-width: 280px;
    }

    h1 {
      font-size: 2.6rem;
      line-height: 1.1;
      margin: 0 0 0.5rem 0;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #aaa;
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .contact-info {
      font-size: 1rem;
      color: #ccc;
      line-height: 1.6;
      border-top: 1px solid #444;
      padding-top: 1.5rem;
    }

    .contact-info a {
      color: #fff;
      text-decoration: none;
    }
    
    .contact-info a:hover {
      text-decoration: underline;
    }

    .main-flow {
      flex: 2;
    }

    .bio-text {
      font-size: 1.25rem;
      line-height: 1.65;
      color: #eeeeee;
      text-align: justify;
      margin-bottom: 2rem;
    }

    h2 {
      font-size: 1.3rem;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #aaa;
      border-bottom: 1px solid #444;
      padding-bottom: 0.3rem;
    }

    .timeline {
      border-left: 1px solid #555;
      padding-left: 1.5rem;
      margin-left: 0.2rem;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 2rem;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: calc(-1.5rem - 4px);
      top: 0.5rem;
      width: 7px;
      height: 7px;
      background: #888;
      border-radius: 50%;
    }

    .item-year {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 0.2rem;
    }

    .item-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
    }

    .item-institution {
      font-size: 1.1rem;
      color: #ccc;
      font-style: italic;
    }

    .item-details {
      font-size: 1.05rem;
      color: #aaa;
      margin-top: 0.3rem;
      line-height: 1.5;
      text-align: justify;
    }

    .coursework-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem 1rem;
      font-size: 1.1rem;
      color: #ddd;
    }

    .course-item {
      border-left: 2px solid #444;
      padding-left: 0.8rem;
    }

    .course-prof {
      display: block;
      font-size: 0.95rem;
      color: #777;
    }

    @media (max-width: 768px) {
      .about-grid {
        flex-direction: column;
        gap: 2rem;
      }
      .sidebar {
        max-width: 100%;
      }
      .coursework-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <a href="index.html" class="nav-link">Home</a>
    <a href="en.html" class="nav-link">Thoughts</a>
